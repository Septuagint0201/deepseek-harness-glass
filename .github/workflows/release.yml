name: release

on:
  push:
    tags:
      - "glass-*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test connection and process lifecycle
        run: python3 glass/Tests/smoke.py

      - name: Assemble app
        run: |
          export APP_PATH="$PWD/glass/dist/DeepSeek Harness.app"
          cd glass && ./assemble.sh

      - name: Verify signature
        run: |
          test ! -e "glass/dist/DeepSeek Harness.app/Contents/Resources/node"
          test ! -e "glass/dist/DeepSeek Harness.app/Contents/Resources/backend"
          codesign -v "glass/dist/DeepSeek Harness.app"
          test -z "$(find 'glass/dist/DeepSeek Harness.app' -type l)" \
            && echo "no symlinks (dmg-safe)" || { echo "symlinks present"; exit 1; }

      - name: Make DMG
        run: |
          mkdir -p dmg-stage
          cp -R "glass/dist/DeepSeek Harness.app" dmg-stage/
          ln -s /Applications dmg-stage/Applications
          hdiutil create -volname "DeepSeek Harness Glass" -srcfolder dmg-stage \
            -ov -format UDZO "DeepSeek Harness Glass-${GITHUB_REF_NAME}.dmg"
          rm -rf dmg-stage

      # A locally verified release may already contain the canonical DMG.
      # Never overwrite its assets with another build of the same tag.
      - name: Check existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/glass-') && steps.existing.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: "DeepSeek Harness Glass-*.dmg"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc.') || contains(github.ref_name, '-alpha.') || contains(github.ref_name, '-beta.') }}
          generate_release_notes: true
