name: checks-and-release

on:
  push:
    branches: [main]
    tags: ["glass-*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-latest
    outputs:
      prerelease: ${{ steps.release-metadata.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Read release metadata
        id: release-metadata
        if: startsWith(github.ref, 'refs/tags/glass-')
        run: |
          test "$(/usr/libexec/PlistBuddy -c 'Print :GlassReleaseVersion' glass/Info.plist)" = "$GITHUB_REF_NAME"
          test "$(/usr/libexec/PlistBuddy -c 'Print :DSHCompatibleVersion' glass/Info.plist)" = "${GITHUB_REF_NAME#glass-}"
          PRERELEASE=$(/usr/libexec/PlistBuddy -c 'Print :GlassPrerelease' glass/Info.plist)
          case "$PRERELEASE" in true|false) ;; *) exit 1 ;; esac
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Test connection, downloads and process lifecycle
        run: python3 glass/Tests/smoke.py

      - name: Test atomic installation
        run: python3 glass/Tests/install.py

      - name: Assemble app
        run: APP_PATH="$PWD/glass/dist/DeepSeek Harness.app" glass/assemble.sh

      - name: Verify frontend-only bundle and signature
        run: |
          test ! -e "glass/dist/DeepSeek Harness.app/Contents/Resources/node"
          test ! -e "glass/dist/DeepSeek Harness.app/Contents/Resources/backend"
          codesign --verify --deep --strict "glass/dist/DeepSeek Harness.app"
          if find "glass/dist/DeepSeek Harness.app" -type l | read -r _; then
            echo "App bundle contains symlinks" >&2
            exit 1
          fi

      - name: Make release DMG and checksum
        if: startsWith(github.ref, 'refs/tags/glass-')
        run: |
          mkdir -p dmg-stage release-assets
          cp -R "glass/dist/DeepSeek Harness.app" dmg-stage/
          ln -s /Applications dmg-stage/Applications
          DSH_VERSION="${GITHUB_REF_NAME#glass-}"
          DMG="DeepSeek-Harness-Glass-${DSH_VERSION}-macos-arm64.dmg"
          hdiutil create -volname "DeepSeek Harness Glass" -srcfolder dmg-stage \
            -ov -format UDZO "release-assets/$DMG"
          hdiutil verify "release-assets/$DMG"
          (cd release-assets && shasum -a 256 "$DMG" > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v7.0.2
        if: startsWith(github.ref, 'refs/tags/glass-')
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error

  real-dsh:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        dsh: ["0.2.1-rc.2", "0.2.1-rc.3"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install test CLI
        run: npm install --global "@deepseek-ai/dsh@${{ matrix.dsh }}"
      - name: Test real authentication, WebKit frontend and shutdown
        env:
          GLASS_TEST_REAL_DSH: "1"
          GLASS_TEST_DSH_VERSION: ${{ matrix.dsh }}
        run: python3 glass/Tests/smoke.py

  publish:
    if: startsWith(github.ref, 'refs/tags/glass-')
    needs: [build-macos, real-dsh]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-assets
          path: release-assets

      # Preserve the canonical assets when a verified local release exists.
      - name: Check existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        if: steps.existing.outputs.exists != 'true'
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
          draft: false
          name: ${{ github.ref_name }}
          prerelease: ${{ needs.build-macos.outputs.prerelease == 'true' }}
          generate_release_notes: true
